name: ci

on:
  push:
    branches: [main, codex/diagnose-windows-timeouts-5319d7d]
  pull_request:

permissions:
  contents: read

env:
  CANDIDATE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  governance:
    if: github.ref != 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - name: Validate path-based licensing policy
        shell: pwsh
        run: |
          ./eng/Test-LicensePolicy.Tests.ps1
          ./eng/Test-LicensePolicy.ps1
      - name: Test DCO gate behavior
        shell: pwsh
        run: ./eng/Test-DcoSignoff.Tests.ps1
      - name: Validate DCO sign-offs for pull request commits
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./eng/Test-DcoSignoff.ps1 -BaseCommit '${{ github.event.pull_request.base.sha }}' -HeadCommit '${{ github.event.pull_request.head.sha }}'

  build-test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate immutable .NET container base images
        shell: pwsh
        run: ./eng/validate-container-base-images.ps1 -SelfTest
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        shell: pwsh
        run: ./eng/build.ps1
      - name: Acquire frozen FSE2 T03 dataset objects
        shell: pwsh
        run: |
          $datasetPath = Join-Path $env:RUNNER_TEMP 'fse2-t03-dataset-d937255f'
          ./eng/Acquire-Fse2T03FrozenDataset.ps1 -DestinationPath $datasetPath
          "FSE2_T03_DATASET_REPOSITORY_PATH=$datasetPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $results = [IO.Path]::GetFullPath('.artifacts/test-results/suite-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          "SIP_SUITE_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIP_TIMEOUT_DIAGNOSTICS=$(Join-Path $env:RUNNER_TEMP 'timeout-observations')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FSE2_T03_SOURCE_SHA=$env:CANDIDATE_COMMIT_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FSE2_T03_REDACTED_RESULT_PATH=$(Join-Path $results 't03-redacted-result.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test
        shell: pwsh
        run: |
          ./eng/Test-NamedTestResult.Tests.ps1
          ./eng/test.ps1 -ResultsDirectory $env:SIP_SUITE_RESULTS
      - name: Retain only named timeout diagnostic results
        if: always() && github.ref == 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
        shell: pwsh
        run: |
          ./eng/Export-TimeoutObservation.ps1
      - name: Upload reduced timeout observations
        if: always() && github.ref == 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
        uses: actions/upload-artifact@v4
        with:
          name: timeout-observations-${{ github.sha }}
          path: ${{ runner.temp }}/timeout-observations/reduced.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify exact frozen FSE2 T03 result from the suite
        shell: pwsh
        run: |
          $fullyQualifiedName = 'SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OrganizationHostedIntegrationTests.FSE2_T03_case_476_reads_frozen_git_objects_and_preserves_exact_official_PDF_in_multipart'
          ./eng/Assert-NamedTestResult.ps1 -ResultsDirectory $env:SIP_SUITE_RESULTS -FullyQualifiedName $fullyQualifiedName
          $evidence = Get-Content -LiteralPath $env:FSE2_T03_REDACTED_RESULT_PATH -Raw | ConvertFrom-Json
          if ($evidence.sourceSha -cne $env:CANDIDATE_COMMIT_SHA -or -not $evidence.multipart.exactByteIdentity) { throw 'FSE2_T03_REDACTED_RESULT_INVALID' }
      - name: Remove task-owned frozen FSE2 T03 dataset
        if: always()
        shell: pwsh
        run: |
          $datasetPath = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'fse2-t03-dataset-d937255f'))
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (-not $datasetPath.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "FSE2_T03_DATASET_CLEANUP_PATH_REJECTED: $datasetPath"
          }
          if (Test-Path -LiteralPath $datasetPath) { Remove-Item -LiteralPath $datasetPath -Recurse -Force }
      - name: Build and test optional local PKCS12 provider pack
        shell: pwsh
        run: |
          dotnet restore BrokerGateway.LocalPkcs12.slnx --locked-mode
          dotnet build BrokerGateway.LocalPkcs12.slnx --configuration Release --no-restore
          dotnet test BrokerGateway.LocalPkcs12.slnx --configuration Release --no-build --no-restore
      - name: Parse FSE2 local-provider tooling with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scripts = Get-ChildItem tools/fse2 -Include *.ps1,*.psm1 -Recurse
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "$($script.Name): $($errors[0].Message)" }
          }
          ./tools/fse2/Test-Fse2LocalPkcs12Material.ps1
      - name: Parse M3 split-host runners with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scripts = Get-ChildItem tools/m3/split-host -Include *.ps1,*.psm1 -Recurse
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "$($script.Name): $($errors[0].Message)" }
          }
          ./eng/test-m3-split-firewall.ps1
          ./eng/test-m3-split-network.ps1
          ./eng/test-m3-operator-handoff.ps1
      - name: Test M5 quickstart artifact safety with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/m5/Test-M5QuickstartSafety.ps1 -TestName All
      - name: Validate documentation
        shell: pwsh
        run: ./eng/validate-docs.ps1
      - name: Scan source for accidental secrets
        shell: pwsh
        run: ./eng/scan-secrets.ps1
      - name: Vulnerable packages
        run: dotnet list BrokerGateway.slnx package --vulnerable --include-transitive
      - name: Generate SBOM
        shell: pwsh
        run: |
          ./eng/generate-sbom.ps1 -SkipContainer
          ./eng/test-sbom-modes.ps1

  gitleaks:
    if: github.ref != 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - uses: gitleaks/gitleaks-action@v2

  gateway-postgresql-18:
    if: github.ref != 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: broker_gateway_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d broker_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GATEWAY_POSTGRES_ADMIN_CONNECTION: Host=127.0.0.1;Port=5432;Database=broker_gateway_test;Username=ci_gateway_admin;SSL Mode=Disable;GSS Encryption Mode=Disable
      GATEWAY_MIGRATION_CONNECTION: Host=127.0.0.1;Port=5432;Database=broker_gateway_test;Username=postgres;SSL Mode=Disable
      GATEWAY_POSTGRES_MIGRATION_CONNECTION: Host=127.0.0.1;Port=5432;Database=broker_gateway_test;Username=postgres;SSL Mode=Disable;GSS Encryption Mode=Disable
      GATEWAY_REQUIRE_AUTHORIZED_OPERATION_POSTGRES_GATE: "true"
      EXPECTED_M2_MIGRATION_SHA256: 182CC690E16BB986638A4B52EE1554A4B540A8E58FD673F2111A79D194C66A98
      EXPECTED_M4_MIGRATION_SHA256: 9D991B0E4E8268D47C32121DECE2D3593B183623059BB17F4A82A479DC8D322C
      EXPECTED_M55_MIGRATION_SHA256: 62D79829F1B3DF072E563A415B9380053227C6BCCA774C70C113DA372BC977C1
      REQUIRE_FSE2_POSTGRES_GATE: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore Gateway integration tests
        run: dotnet restore tests/integration/Gateway.Integration.Tests/Gateway.Integration.Tests.csproj --locked-mode
      - name: Restore Healthcare FSE2 integration tests
        run: dotnet restore tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj --locked-mode
      - name: Restore and build migration runner
        run: |
          dotnet restore src/Gateway/Gateway.Migrations/Gateway.Migrations.csproj --locked-mode
          dotnet build src/Gateway/Gateway.Migrations/Gateway.Migrations.csproj -c Release --no-restore
      - name: Verify migration checksum and idempotency from an empty database
        shell: bash
        run: |
          set -euo pipefail
          actual_m2_sha="$(sha256sum src/Gateway/Gateway.Infrastructure/Persistence/Migrations/0001_gateway_m2.sql | awk '{print toupper($1)}')"
          actual_m4_sha="$(sha256sum src/Gateway/Gateway.Infrastructure/Persistence/Migrations/0002_connector_configuration_m4.sql | awk '{print toupper($1)}')"
          actual_m55_sha="$(sha256sum src/Gateway/Gateway.Infrastructure/Persistence/Migrations/0011_direct_installation_m55.sql | awk '{print toupper($1)}')"
          test "$actual_m2_sha" = "$EXPECTED_M2_MIGRATION_SHA256"
          test "$actual_m4_sha" = "$EXPECTED_M4_MIGRATION_SHA256"
          test "$actual_m55_sha" = "$EXPECTED_M55_MIGRATION_SHA256"
          first_output="$(dotnet run --project src/Gateway/Gateway.Migrations/Gateway.Migrations.csproj -c Release --no-build -- apply)"
          grep -F "Applied 0001_gateway_m2.sql ($EXPECTED_M2_MIGRATION_SHA256)" <<<"$first_output"
          grep -F "Applied 0002_connector_configuration_m4.sql ($EXPECTED_M4_MIGRATION_SHA256)" <<<"$first_output"
          grep -F "Applied 0011_direct_installation_m55.sql ($EXPECTED_M55_MIGRATION_SHA256)" <<<"$first_output"
          second_output="$(dotnet run --project src/Gateway/Gateway.Migrations/Gateway.Migrations.csproj -c Release --no-build -- apply)"
          if grep -Fq "Applied " <<<"$second_output"; then
            echo "Second migration application was not a no-op." >&2
            exit 1
          fi
      - name: Verify roles, forced RLS and runtime least privilege
        shell: bash
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_cmd=(docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U postgres -d broker_gateway_test -At)
          test "$("${psql_cmd[@]}" -c "SELECT count(*) FROM pg_roles WHERE rolname IN ('gateway_runtime','gateway_admin','gateway_readonly') AND NOT rolcanlogin AND NOT rolsuper AND NOT rolcreaterole AND NOT rolcreatedb;")" = "3"
          test "$("${psql_cmd[@]}" -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='gateway' AND c.relrowsecurity AND c.relforcerowsecurity AND c.relname IN ('installation','installation_credential','activation_code','installation_connector_grant','replay_nonce','audit_event','invocation_event');")" = "7"
          test "$("${psql_cmd[@]}" -c "SELECT has_schema_privilege('gateway_runtime','gateway','CREATE');")" = "f"
          test "$("${psql_cmd[@]}" -c "SELECT has_table_privilege('gateway_runtime','gateway.schema_migration','SELECT') OR has_table_privilege('gateway_runtime','gateway.schema_migration','INSERT') OR has_table_privilege('gateway_runtime','gateway.schema_migration','UPDATE') OR has_table_privilege('gateway_runtime','gateway.schema_migration','DELETE');")" = "f"
          test "$("${psql_cmd[@]}" -c "SELECT count(*) FROM pg_indexes WHERE schemaname='gateway' AND indexname='ux_connector_one_published_version';")" = "1"
          test "$("${psql_cmd[@]}" -c "SELECT count(*) FROM pg_trigger WHERE tgname='connector_version_immutable' AND NOT tgisinternal;")" = "1"
          test "$("${psql_cmd[@]}" -c "SELECT has_table_privilege('gateway_runtime','gateway.connector_version','SELECT') AND NOT has_table_privilege('gateway_runtime','gateway.connector_version','INSERT') AND NOT has_table_privilege('gateway_runtime','gateway.connector_version','UPDATE');")" = "t"
      - name: Create non-superuser integration-test principal
        shell: bash
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U postgres -d broker_gateway_test -c "CREATE ROLE ci_gateway_admin LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION; GRANT gateway_admin TO ci_gateway_admin;"
      - name: Build Gateway integration tests
        run: dotnet build tests/integration/Gateway.Integration.Tests/Gateway.Integration.Tests.csproj -c Release --no-restore
      - name: Build Healthcare FSE2 integration tests
        run: dotnet build tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj -c Release --no-restore
      - name: Run PostgreSQL and API integration tests
        shell: bash
        run: |
          set -euo pipefail
          results_directory=".artifacts/test-results/gateway-postgresql-18"
          mkdir -p "$results_directory"
          dotnet test tests/integration/Gateway.Integration.Tests/Gateway.Integration.Tests.csproj -c Release --no-build --no-restore \
            --logger "trx;LogFileName=gateway-postgresql-18.trx" \
            --results-directory "$results_directory"
          counters="$(grep -o '<Counters [^>]*/>' "$results_directory/gateway-postgresql-18.trx" | tail -n 1)"
          read_counter() {
            sed -n "s/.* $1=\"\([0-9][0-9]*\)\".*/\1/p" <<<"$counters"
          }
          passed="$(read_counter passed)"
          skipped="$(read_counter notExecuted)"
          failed="$(read_counter failed)"
          test -n "$passed" && test -n "$skipped" && test -n "$failed"
          echo "Passed=$passed Skipped=$skipped Failed=$failed"
          test "$passed" -gt 0
          test "$skipped" -eq 0
          test "$failed" -eq 0
      - name: Run canonical Healthcare FSE2 PostgreSQL integration test
        run: >-
          dotnet test tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj
          -c Release --no-build --no-restore
          --filter FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OrganizationHostedIntegrationTests.FSE2_IT_PRODUCTION_HOST_PostgreSQL18_Published_Organization_dual_JWT_mTLS_exact_bytes
      - name: Run durable FSE2 validation-publication PostgreSQL sequences
        run: >-
          dotnet test tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj
          -c Release --no-build --no-restore
          --filter FullyQualifiedName~Fse2DurableWorkflowCorrelationIntegrationTests
      - name: Run contiguous FSE2 failure diagnostics PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          results_directory=".artifacts/test-results/fse2-failure-diagnostics-postgresql-18"
          mkdir -p "$results_directory"
          filter='FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OrganizationHostedIntegrationTests.FSE2_IT_DAT_PostgreSQL18_transport_audit_Admin_API_and_evidence_reducer_round_trip|FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OrganizationHostedIntegrationTests.FSE2_IT_DAT_PostgreSQL18_local_mapping_failure_round_trip_is_bounded'
          dotnet test tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter "$filter" \
            --logger "trx;LogFileName=fse2-failure-diagnostics-postgresql-18.trx" \
            --results-directory "$results_directory"
          counters="$(grep -o '<Counters [^>]*/>' "$results_directory/fse2-failure-diagnostics-postgresql-18.trx" | tail -n 1)"
          test "$(sed -n 's/.* passed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 2
          test "$(sed -n 's/.* failed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
          test "$(sed -n 's/.* notExecuted="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
      - name: Run OfficialTest provisioning PostgreSQL integration test
        shell: bash
        run: |
          set -euo pipefail
          results_directory=".artifacts/test-results/fse2-officialtest-postgresql-18"
          mkdir -p "$results_directory"
          dotnet test tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OfficialTestProvisioningIntegrationTests.FSE2_OFFICIALTEST_PostgreSQL18_D1_approval_is_invalidated_before_D2_distinct_approver_publication_and_replay_is_denied \
            --logger "trx;LogFileName=fse2-officialtest-postgresql-18.trx" \
            --results-directory "$results_directory"
          counters="$(grep -o '<Counters [^>]*/>' "$results_directory/fse2-officialtest-postgresql-18.trx" | tail -n 1)"
          test "$(sed -n 's/.* passed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 1
          test "$(sed -n 's/.* failed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
          test "$(sed -n 's/.* notExecuted="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
      - name: Run OfficialTest clean-state Installation authority gate
        shell: bash
        run: |
          set -euo pipefail
          results_directory=".artifacts/test-results/fse2-officialtest-clean-state"
          mkdir -p "$results_directory"
          dotnet test tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OfficialTestProvisionerAuthorityIntegrationTests.PROVISIONER_clean_state_golden_path_stays_below_25_percent_of_each_quota \
            --logger "trx;LogFileName=fse2-officialtest-clean-state.trx" \
            --results-directory "$results_directory"
          counters="$(grep -o '<Counters [^>]*/>' "$results_directory/fse2-officialtest-clean-state.trx" | tail -n 1)"
          test "$(sed -n 's/.* passed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 2
          test "$(sed -n 's/.* failed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
          test "$(sed -n 's/.* notExecuted="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
      - name: Run independent same-NAT dual-onboarding gate
        shell: bash
        run: |
          set -euo pipefail
          results_directory=".artifacts/test-results/independent-same-nat-dual-onboarding"
          mkdir -p "$results_directory"
          dotnet test tests/integration/Healthcare.FSE2.Integration.Tests/Healthcare.FSE2.Integration.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter 'FullyQualifiedName~SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OfficialTestProvisionerAuthorityIntegrationTests.ADMIN_RATE_LIMIT_|FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OfficialTestProvisionerAuthorityIntegrationTests.FSE2_OFFICIALTEST_dual_same_NAT_onboarding_uses_real_provisioner_plan_apply_verify|FullyQualifiedName=SecureIntegration.ConnectorPacks.Healthcare.FSE2.Integration.Tests.Fse2OfficialTestProvisionerAuthorityIntegrationTests.FSE2_OFFICIALTEST_second_workflow_is_distinct_and_not_a_published_noop' \
            --logger "trx;LogFileName=independent-same-nat-dual-onboarding.trx" \
            --results-directory "$results_directory"
          counters="$(grep -o '<Counters [^>]*/>' "$results_directory/independent-same-nat-dual-onboarding.trx" | tail -n 1)"
          test "$(sed -n 's/.* passed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 12
          test "$(sed -n 's/.* failed="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
          test "$(sed -n 's/.* notExecuted="\([0-9][0-9]*\)".*/\1/p' <<<"$counters")" -eq 0
      - name: Clean PostgreSQL test schema
        if: always()
        shell: bash
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U postgres -d broker_gateway_test -c "DROP SCHEMA IF EXISTS gateway CASCADE;"

  gateway-container:
    if: github.ref != 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - name: Validate immutable .NET container base images
        shell: pwsh
        run: ./eng/validate-container-base-images.ps1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build Gateway container
        id: image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_SHA"
          docker build --pull --provenance=false --build-arg "PRODUCT_VERSION=0.1.0-alpha.1" --build-arg "SOURCE_REVISION=$CANDIDATE_COMMIT_SHA" --label "org.opencontainers.image.revision=$CANDIDATE_COMMIT_SHA" -f src/Gateway/Gateway.Api/Dockerfile -t broker-gateway:m2 .
          docker build --pull --provenance=false --build-arg "PRODUCT_VERSION=0.1.0-alpha.1" --build-arg "SOURCE_REVISION=$CANDIDATE_COMMIT_SHA" --label "org.opencontainers.image.revision=$CANDIDATE_COMMIT_SHA" -f src/Gateway/Gateway.Migrations/Dockerfile -t broker-gateway-migrations:m2 .
          image_digest="$(docker image inspect broker-gateway:m2 --format '{{.Id}}')"
          migration_digest="$(docker image inspect broker-gateway-migrations:m2 --format '{{.Id}}')"
          [[ "$image_digest" == sha256:* ]]
          [[ "$migration_digest" == sha256:* ]]
          test "$(docker image inspect broker-gateway:m2 | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')" = "$CANDIDATE_COMMIT_SHA"
          printf 'gateway_image=%s\nmigration_image=%s\ncommit=%s\n' "$image_digest" "$migration_digest" "$CANDIDATE_COMMIT_SHA" | tee gateway-image-digests.txt
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
      - name: Validate alpha TAR byte identity, candidate-tag precondition and subject binding
        shell: pwsh
        run: >-
          ./eng/Test-AlphaReleaseContainerBinding.ps1
          -GatewaySourceReference broker-gateway:m2
          -MigrationsSourceReference broker-gateway-migrations:m2
          -ExpectedSourceCommit $env:CANDIDATE_COMMIT_SHA
      - name: Build and attest Azure deployment container at exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_SHA"
          set -x
          docker build --pull --no-cache -f packs/deployment/azure/Dockerfile --label "org.opencontainers.image.revision=$CANDIDATE_COMMIT_SHA" -t broker-gateway-azure:m2 .
          set +x
          azure_image_digest="$(docker image inspect broker-gateway-azure:m2 --format '{{.Id}}')"
          azure_image_revision="$(docker image inspect broker-gateway-azure:m2 | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')"
          [[ "$azure_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$azure_image_revision" = "$CANDIDATE_COMMIT_SHA"
          printf 'AZURE_IMAGE_DIGEST=%s\nAZURE_IMAGE_REVISION=%s\n' "$azure_image_digest" "$azure_image_revision" | tee azure-image-digest.txt
      - name: Build and attest local PKCS12 deployment container at exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_SHA"
          set -x
          docker build --pull --no-cache -f packs/deployment/local-pkcs12/Dockerfile --label "org.opencontainers.image.revision=$CANDIDATE_COMMIT_SHA" -t broker-gateway-local-pkcs12:m2 .
          set +x
          local_image_digest="$(docker image inspect broker-gateway-local-pkcs12:m2 --format '{{.Id}}')"
          local_image_revision="$(docker image inspect broker-gateway-local-pkcs12:m2 | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')"
          [[ "$local_image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$local_image_revision" = "$CANDIDATE_COMMIT_SHA"
          printf 'LOCAL_PKCS12_IMAGE_DIGEST=%s\nLOCAL_PKCS12_IMAGE_REVISION=%s\n' "$local_image_digest" "$local_image_revision" | tee local-pkcs12-image-digest.txt
      - name: Run canonical FSE2 local-provider validator and active-provider lab
        shell: pwsh
        run: |
          ./tools/fse2/Test-Fse2PathPolicy.ps1
          ./tools/fse2/Test-Fse2LocalPkcs12Material.ps1 -DotNetPath (Get-Command dotnet).Source -ValidateCompose -StartLab
      - name: Verify executable, non-root, read-only, health, readiness and clean shutdown
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f broker-gateway-m2 gateway-failclosed >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          configured_user="$(docker image inspect broker-gateway:m2 --format '{{.Config.User}}')"
          test -n "$configured_user"
          test "$configured_user" != "0"
          docker run -d --name broker-gateway-m2 --read-only --tmpfs /tmp:size=64m,mode=1777 -p 18080:8080 -e ASPNETCORE_ENVIRONMENT=Development broker-gateway:m2
          test "$(docker inspect broker-gateway-m2 --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect broker-gateway-m2 --format '{{len .Mounts}}')" = "0"
          test "$(docker exec broker-gateway-m2 id -u)" != "0"
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null && curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"
          docker stop --time 15 broker-gateway-m2
          test "$(docker inspect broker-gateway-m2 --format '{{.State.ExitCode}}')" = "0"
          if docker run --name gateway-failclosed -e ASPNETCORE_ENVIRONMENT=Production broker-gateway:m2; then
            echo "Production container started without mandatory configuration." >&2
            exit 1
          fi
          test "$(docker inspect gateway-failclosed --format '{{.State.ExitCode}}')" != "0"
      - name: Scan image for embedded secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: broker-gateway:m2
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan local PKCS12 image for embedded secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: broker-gateway-local-pkcs12:m2
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: broker-gateway:m2
          format: spdx-json
          output-file: gateway-image.spdx.json
          artifact-name: gateway-image-sbom-${{ env.CANDIDATE_COMMIT_SHA }}.spdx.json
      - name: Generate local PKCS12 image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: broker-gateway-local-pkcs12:m2
          format: spdx-json
          output-file: local-pkcs12-image.spdx.json
          artifact-name: local-pkcs12-image-sbom-${{ env.CANDIDATE_COMMIT_SHA }}.spdx.json
      - name: Upload image digest evidence
        uses: actions/upload-artifact@v6
        with:
          name: gateway-image-digest-${{ env.CANDIDATE_COMMIT_SHA }}
          path: |
            gateway-image-digests.txt
            azure-image-digest.txt
            local-pkcs12-image-digest.txt
          if-no-files-found: error

  m3-deterministic-container-slice:
    if: github.ref != 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - name: Validate immutable .NET container base images
        shell: pwsh
        run: ./eng/validate-container-base-images.ps1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate M3 Azure template
        run: |
          az bicep install
          az bicep build --file deploy/azure-bicep/m3-dev.bicep --stdout >/dev/null
      - name: Generate per-run synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/m3/ci/raw-evidence .artifacts/m3/ci/redacted-evidence
          date -u +"%Y-%m-%dT%H:%M:%SZ" >.artifacts/m3/ci/raw-evidence/started-at-utc.txt
          dotnet run --project tools/m3/FixtureGenerator/FixtureGenerator.csproj -c Release -- .artifacts/m3/ci/raw-evidence
          chmod 0777 .artifacts/m3/ci/raw-evidence
          sudo cp .artifacts/m3/ci/raw-evidence/certificates/ca.crt /usr/local/share/ca-certificates/m3-synthetic.crt
          sudo update-ca-certificates
      - name: Validate compose and start real Gateway/PostgreSQL/Vault/vendor stack
        shell: bash
        run: |
          set -euo pipefail
          env_file=.artifacts/m3/ci/raw-evidence/m3a.env
          docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml config --quiet
          split_config="$(M3_GATEWAY_BIND_IP=192.0.2.10 M3_GATEWAY_PORT=28443 docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml config --format json)"
          jq -e '.services.gateway.ports[0].host_ip == "192.0.2.10" and .services.gateway.ports[0].published == "28443"' <<<"$split_config"
          jq -e '[.services.postgres,.services.vault,.services.vendor] | all(.ports[0].host_ip == "127.0.0.1")' <<<"$split_config"
          docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml up --build --pull always --detach
          for attempt in {1..90}; do
            gateway_container="$(docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml ps -q gateway)"
            gateway_health="$(docker inspect "$gateway_container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            if test "$gateway_health" = healthy && \
               curl --fail --silent --show-error --noproxy '*' https://localhost:18443/health/live >/dev/null && \
               curl --fail --silent --show-error --noproxy '*' https://localhost:18443/health/ready >/dev/null && \
               test -f .artifacts/m3/ci/raw-evidence/provisioning.json; then break; fi
            test "$gateway_health" != unhealthy
            test "$attempt" -lt 90
            sleep 2
          done
          test "$(docker inspect "$gateway_container" --format '{{.State.Health.Status}}')" = healthy
          docker exec "$gateway_container" dotnet SecureIntegration.Gateway.Api.dll --health-probe
          if curl --fail --silent --show-error --noproxy '*' \
             --resolve san-mismatch.m3.test:18443:127.0.0.1 \
             https://san-mismatch.m3.test:18443/health/live >/dev/null 2>&1; then
            echo 'TLS accepted an HTTPS hostname absent from the certificate SAN.' >&2
            exit 1
          fi
          if docker exec -e GATEWAY_HEALTH_URL=https://gateway:8443/health/live "$gateway_container" dotnet SecureIntegration.Gateway.Api.dll --health-probe; then
            echo 'Health probe accepted a DNS name absent from the certificate SAN.' >&2
            exit 1
          fi
          set -a
          source "$env_file"
          set +a
          openssl pkcs12 -in .artifacts/m3/ci/raw-evidence/certificates/gateway.pfx -clcerts -nokeys -passin "pass:${M3_CERTIFICATE_PASSWORD}" 2>/dev/null |
            openssl x509 -noout -ext subjectAltName |
            grep -F 'DNS:localhost, IP Address:127.0.0.1'
          pwsh -NoLogo -NoProfile -File eng/validate-tls-hardening.ps1
      - name: Run M3 positive and negative Gateway scenarios
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .artifacts/m3/ci/raw-evidence/m3a.env
          set +a
          export M3_GATEWAY_BASE_ADDRESS=https://localhost:18443/
          export M3_PROVISIONING_FILE="$PWD/.artifacts/m3/ci/raw-evidence/provisioning.json"
          export M3_SECURITY_DRIVER_PFX="$PWD/.artifacts/m3/ci/raw-evidence/certificates/security-driver.pfx"
          export M3_POSTGRES_ADMIN_CONNECTION="Host=127.0.0.1;Port=15432;Database=broker_gateway_m3;Username=postgres;Password=${M3_POSTGRES_ADMIN_PASSWORD};SSL Mode=Disable;GSS Encryption Mode=Disable"
          export M3_SECURITY_OUTPUT="$PWD/.artifacts/m3/ci/redacted-evidence/security-scenarios.json"
          dotnet run --project tools/m3/SecurityDriver/SecurityDriver.csproj -c Release
          jq -e '.passed == true' "$M3_SECURITY_OUTPUT"
      - name: Verify non-root/read-only fixtures and secret redaction
        shell: bash
        run: |
          set -euo pipefail
          env_file=.artifacts/m3/ci/raw-evidence/m3a.env
          set -a
          source "$env_file"
          set +a
          provisioning=.artifacts/m3/ci/raw-evidence/provisioning.json
          logs=.artifacts/m3/ci/raw-evidence/containers.log
          docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml logs --no-color >"$logs"
          if grep -Fiq -- 'libgssapi_krb5' "$logs"; then
            echo 'Unexpected optional GSSAPI load warning found in M3 container logs.' >&2
            exit 1
          fi
          for service in gateway vault vendor; do
            container_id="$(docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml ps -q "$service")"
            test -n "$container_id"
            test "$(docker inspect "$container_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = true
            test "$(docker exec "$container_id" id -u)" != 0
          done
          mapfile -t canaries < <(printf '%s\n' \
            "$(jq -r .activationCode "$provisioning")" \
            "$(jq -r .securityActivationCode "$provisioning")" \
            "$M3_VENDOR_API_KEY" "$M3_SYNTHETIC_VAULT_TOKEN" "$M3_VENDOR_CONTROL_TOKEN" \
            "$M3_POSTGRES_ADMIN_PASSWORD" "$M3_POSTGRES_RUNTIME_PASSWORD" \
            "$M3_CERTIFICATE_PASSWORD" "$M3_ACTIVATION_HMAC_BASE64")
          for canary in "${canaries[@]}"; do
            if grep -Fq -- "$canary" "$logs"; then echo 'A sensitive canary was found in container logs.' >&2; exit 1; fi
          done
      - name: Package redacted M3 deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_SHA"
          env_file=.artifacts/m3/ci/raw-evidence/m3a.env
          redacted=.artifacts/m3/ci/redacted-evidence
          gateway_container="$(docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml ps -q gateway)"
          vault_container="$(docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml ps -q vault)"
          vendor_container="$(docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml ps -q vendor)"
          gateway_digest="$(docker inspect "$gateway_container" --format '{{.Image}}')"
          vault_digest="$(docker inspect "$vault_container" --format '{{.Image}}')"
          vendor_digest="$(docker inspect "$vendor_container" --format '{{.Image}}')"
          postgres_version="$(docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml exec -T postgres postgres --version)"
          migration_sha="$(sha256sum src/Gateway/Gateway.Infrastructure/Persistence/Migrations/0001_gateway_m2.sql | awk '{print toupper($1)}')"
          started_at="$(cat .artifacts/m3/ci/raw-evidence/started-at-utc.txt)"
          dotnet_version="$(dotnet --version)"
          docker_version="$(docker version --format '{{.Server.Version}}')"
          compose_version="$(docker compose version --short)"
          cp .artifacts/m3/ci/raw-evidence/fixture-public.json "$redacted/fixture-public.json"
          jq -n --arg runId "$GITHUB_RUN_ID" --arg commit "$CANDIDATE_COMMIT_SHA" --arg startedAt "$started_at" \
            --arg gatewayDigest "$gateway_digest" --arg vaultDigest "$vault_digest" --arg vendorDigest "$vendor_digest" \
            --arg postgresVersion "$postgres_version" --arg migrationSha "$migration_sha" \
            --arg dotnetVersion "$dotnet_version" --arg dockerVersion "$docker_version" --arg composeVersion "$compose_version" \
            --slurpfile scenarios "$redacted/security-scenarios.json" \
            '{schemaVersion:1,environment:"M3A-CI",scope:"gateway-container-only",runId:$runId,commitSha:$commit,m2BaselineTag:"m2-gateway-baseline-2026-08-04",startedAtUtc:$startedAt,gatewayImageDigest:$gatewayDigest,vaultImageDigest:$vaultDigest,vendorImageDigest:$vendorDigest,migrationSha256:$migrationSha,postgresVersion:$postgresVersion,toolRuntimeVersions:{dotnet:$dotnetVersion,docker:$dockerVersion,compose:$composeVersion},brokerWindowsServiceVerified:false,azureVerified:false,canaryScan:"PASS",scenarios:$scenarios[0]}' >"$redacted/manifest.pre-cleanup.json"
      - name: Collect diagnostics and clean M3 deterministic stack
        if: always()
        shell: bash
        run: |
          set -u
          env_file=.artifacts/m3/ci/raw-evidence/m3a.env
          if test -f "$env_file"; then
            docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml ps || true
            docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml logs --no-color || true
            cleanup_status=PASS
            docker compose --env-file "$env_file" -f deploy/m3/docker-compose.m3a.yml down --volumes --remove-orphans || cleanup_status=FAIL
            remaining_containers="$(docker ps -aq --filter label=com.docker.compose.project=broker-gateway-m3a)"
            remaining_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=broker-gateway-m3a)"
            if test -n "$remaining_containers" || test -n "$remaining_volumes"; then cleanup_status=FAIL; fi
            jq -n --arg status "$cleanup_status" --arg containers "$remaining_containers" --arg volumes "$remaining_volumes" \
              '{status:$status,remainingContainerIds:(if ($containers|length)>0 then $containers else null end),remainingVolumeNames:(if ($volumes|length)>0 then $volumes else null end)}' >.artifacts/m3/ci/redacted-evidence/cleanup.json
            test "$cleanup_status" = PASS
          fi
      - name: Finalize redacted M3 deterministic evidence after cleanup
        shell: bash
        run: |
          set -euo pipefail
          redacted=.artifacts/m3/ci/redacted-evidence
          completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          jq --arg completedAt "$completed_at" --slurpfile cleanup "$redacted/cleanup.json" \
            '. + {completedAtUtc:$completedAt,cleanup:$cleanup[0]}' "$redacted/manifest.pre-cleanup.json" >"$redacted/manifest.json"
          rm "$redacted/manifest.pre-cleanup.json" "$redacted/cleanup.json"
          (cd "$redacted" && zip -q -r "$RUNNER_TEMP/m3a-ci-$GITHUB_RUN_ID-redacted-evidence.zip" .)
          sha256sum "$RUNNER_TEMP/m3a-ci-$GITHUB_RUN_ID-redacted-evidence.zip" >"$RUNNER_TEMP/m3a-ci-$GITHUB_RUN_ID-redacted-evidence.zip.sha256"
      - name: Upload redacted M3 deterministic evidence
        uses: actions/upload-artifact@v6
        with:
          name: m3a-ci-${{ env.CANDIDATE_COMMIT_SHA }}-redacted-evidence
          path: |
            ${{ runner.temp }}/m3a-ci-${{ github.run_id }}-redacted-evidence.zip
            ${{ runner.temp }}/m3a-ci-${{ github.run_id }}-redacted-evidence.zip.sha256
          if-no-files-found: error
          retention-days: 30

  m4-connector-quickstart:
    if: github.ref != 'refs/heads/codex/diagnose-windows-timeouts-5319d7d'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
      - name: Validate immutable .NET container base images
        shell: pwsh
        run: ./eng/validate-container-base-images.ps1
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate M4 quick start prerequisites and CLI
        shell: pwsh
        run: ./tools/m4/Invoke-M4Quickstart.ps1 -Phase Validate
      - name: Run M4 Published connector quick start
        shell: pwsh
        run: ./tools/m4/Invoke-M4Quickstart.ps1 -Phase Start
      - name: Stop M4 stack and verify cleanup
        if: always()
        shell: pwsh
        run: |
          ./tools/m4/Invoke-M4Quickstart.ps1 -Phase Stop
          $containers = docker ps -aq --filter label=com.docker.compose.project=broker-gateway-m4-quickstart
          $volumes = docker volume ls -q --filter label=com.docker.compose.project=broker-gateway-m4-quickstart
          $networks = docker network ls -q --filter label=com.docker.compose.project=broker-gateway-m4-quickstart
          if ($containers -or $volumes -or $networks) { throw 'M4_QUICKSTART_CLEANUP_FAILED' }
