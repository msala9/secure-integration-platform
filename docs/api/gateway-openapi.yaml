openapi: 3.1.0
info:
  title: Secure Integration Platform Gateway API
  version: 0.1.0-alpha.1
  description: Provider-neutral runtime and same-origin OIDC Admin API.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: https://localhost:8443
tags:
  - name: Runtime
  - name: Enrollment
  - name: ConnectorsAdmin
  - name: Administration
  - name: AdminAuth
  - name: Health
paths:
  /v1/enrollments/challenges:
    post:
      tags: [Enrollment]
      operationId: createEnrollmentChallenge
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentChallengeRequest' } } }
      responses:
        '200':
          description: Short-lived enrollment challenge.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentChallengeResponse' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/enrollments:activate:
    post:
      tags: [Enrollment]
      operationId: activateInstallation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActivationRequest' } } }
      responses:
        '200':
          description: Installation enrolled.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/enrollments:renew:
    post:
      tags: [Enrollment]
      operationId: renewInstallationCredential
      security: [{ InstallationMutualTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/BgwTimestamp'
        - $ref: '#/components/parameters/BgwNonce'
        - $ref: '#/components/parameters/BgwContentSha256'
        - $ref: '#/components/parameters/BgwSignature'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RenewalRequest' } } }
      responses:
        '200':
          description: Installation credential renewed.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnrollmentResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/broker-policy:
    get:
      tags: [Runtime]
      operationId: getBrokerPolicy
      security: [{ InstallationMutualTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/BgwTimestamp'
        - $ref: '#/components/parameters/BgwNonce'
        - $ref: '#/components/parameters/BgwContentSha256'
        - $ref: '#/components/parameters/BgwSignature'
      responses:
        '200':
          description: Broker compatibility and authoritative credential lifecycle policy.
          content: { application/json: { schema: { $ref: '#/components/schemas/BrokerPolicy' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/connectors/{connectorId}/operations/{operationId}:invoke:
    post:
      tags: [Runtime]
      operationId: invokeConnectorOperation
      security: [{ InstallationMutualTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/BgwTimestamp'
        - $ref: '#/components/parameters/BgwNonce'
        - $ref: '#/components/parameters/BgwContentSha256'
        - $ref: '#/components/parameters/BgwSignature'
        - { name: traceparent, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvokeRequest' }
      responses:
        '200':
          description: Sanitized connector response envelope with a bounded application result encoded in result.data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvokeResponse' }
              examples:
                canonicalSyntheticSubmit:
                  summary: Canonical sample-secure-service/submit success.
                  value:
                    correlationId: 11111111-1111-1111-1111-111111111111
                    connectorVersion: 1.0.0
                    result:
                      contentType: application/json; charset=utf-8
                      encoding: base64
                      data: eyJhY2NlcHRlZCI6dHJ1ZSwidmVuZG9yUmVmZXJlbmNlIjoic3ludGhldGljLW9yZGVyIn0=
        default: { $ref: '#/components/responses/Problem' }
  /v1/connectors/{connectorId}/operations/{operationId}/session-handshakes/{profileId}:acquire:
    post:
      tags: [Runtime]
      operationId: acquireTypedSessionHandshake
      description: Acquires or starts one server-owned Published typed session profile. The request body must be empty.
      security: [{ InstallationMutualTLS: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/OperationId'
        - { name: profileId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - $ref: '#/components/parameters/BgwTimestamp'
        - $ref: '#/components/parameters/BgwNonce'
        - $ref: '#/components/parameters/BgwContentSha256'
        - $ref: '#/components/parameters/BgwSignature'
      responses:
        '200':
          description: Opaque issued-session metadata, an external-admission intent or a sanitized rejection.
          headers: { Cache-Control: { schema: { type: string, const: no-store }, description: Always no-store. } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TypedSessionHandshakeResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/session-admissions/{intentReference}:complete:
    post:
      tags: [Runtime]
      operationId: completeExternalSessionAdmission
      description: Completes a bounded, opaque, single-use admission intent. The body is sensitive opaque bytes and is never returned.
      security: [{ InstallationMutualTLS: [] }]
      parameters:
        - { name: intentReference, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{40,64}$' } }
        - $ref: '#/components/parameters/BgwTimestamp'
        - $ref: '#/components/parameters/BgwNonce'
        - $ref: '#/components/parameters/BgwContentSha256'
        - $ref: '#/components/parameters/BgwSignature'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, minLength: 1, maxLength: 16384, description: Strict UTF-8 bytes without NUL, CR, LF or other control characters. }
      responses:
        '200':
          description: Opaque issued-session metadata or a sanitized rejection.
          headers: { Cache-Control: { schema: { type: string, const: no-store }, description: Always no-store. } }
          content: { application/json: { schema: { $ref: '#/components/schemas/TypedSessionHandshakeResult' } } }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors:validate:
    post:
      tags: [ConnectorsAdmin]
      operationId: validateConnectorDefinition
      security: [{ AdminBoundary: [] }]
      requestBody: { $ref: '#/components/requestBodies/ConnectorImport' }
      responses:
        '200': { description: Validation result. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors:import:
    post:
      tags: [ConnectorsAdmin]
      operationId: importConnectorDefinition
      security: [{ AdminBoundary: [] }]
      requestBody: { $ref: '#/components/requestBodies/ConnectorImport' }
      responses:
        '201': { description: Draft created. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors:
    get:
      tags: [ConnectorsAdmin]
      operationId: listConnectors
      security: [{ AdminBoundary: [] }]
      responses:
        '200': { description: Redacted Connector list. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions:
    get:
      tags: [ConnectorsAdmin]
      operationId: listConnectorVersions
      security: [{ AdminBoundary: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200': { description: Connector versions. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{version}:
    get:
      tags: [ConnectorsAdmin]
      operationId: showConnectorVersion
      security: [{ AdminBoundary: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/Version'
      responses:
        '200': { description: Version metadata without bindings or secret references. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{version}:export:
    get:
      tags: [ConnectorsAdmin]
      operationId: exportConnectorVersion
      security: [{ AdminBoundary: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Canonical Connector JSON without Environment bindings.
          content: { application/json: { schema: { type: object } } }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{version}:validate:
    post:
      tags: [ConnectorsAdmin]
      operationId: validateStoredConnectorVersion
      security: [{ AdminBoundary: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/Version'
      requestBody: { $ref: '#/components/requestBodies/VersionAction' }
      responses:
        '200': { description: Version validated. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{version}:publish:
    post:
      tags: [ConnectorsAdmin]
      operationId: publishConnectorVersion
      security: [{ AdminBoundary: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/Version'
      requestBody: { $ref: '#/components/requestBodies/VersionAction' }
      responses:
        '200': { description: Version published atomically. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/versions/{version}:retire:
    post:
      tags: [ConnectorsAdmin]
      operationId: retireConnectorVersion
      security: [{ AdminBoundary: [] }]
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/Version'
      requestBody: { $ref: '#/components/requestBodies/VersionAction' }
      responses:
        '200': { description: Version retired. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}:rollback:
    post:
      tags: [ConnectorsAdmin]
      operationId: rollbackConnector
      security: [{ AdminBoundary: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackRequest' }
      responses:
        '200': { description: Previously Published version reactivated. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}/bindings:
    put:
      tags: [ConnectorsAdmin]
      operationId: putConnectorBindings
      security: [{ AdminBoundary: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200': { description: Server-side binding revision updated. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/v1/connectors/{connectorId}:test:
    post:
      tags: [ConnectorsAdmin]
      operationId: testPublishedConnector
      security: [{ AdminBoundary: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200': { description: Published definition and bindings resolve without invocation. }
        default: { $ref: '#/components/responses/Problem' }
  /admin/auth/me:
    get:
      tags: [AdminAuth]
      operationId: getAdminSession
      security: [{ AdminSession: [] }]
      responses:
        '200': { description: Current redacted principal and roles, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSession' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /admin/auth/login:
    get:
      tags: [AdminAuth]
      operationId: beginAdminLogin
      responses: { '302': { description: Redirect to the configured OIDC provider or development login page. }, '404': { $ref: '#/components/responses/Problem' } }
  /admin/auth/csrf:
    get:
      tags: [AdminAuth]
      operationId: getCsrfToken
      responses:
        '200': { description: Opaque anti-CSRF request token, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
  /admin/auth/logout:
    post:
      tags: [AdminAuth]
      operationId: logoutAdmin
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Session invalidated. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/auth/development/login:
    post:
      tags: [AdminAuth]
      operationId: developmentAdminLogin
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [userName], properties: { userName: { type: string } } } } } }
      responses: { '200': { description: Loopback-only synthetic session created. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/dashboard:
    get:
      tags: [Administration]
      operationId: getAdminDashboard
      security: [{ AdminSession: [] }]
      responses:
        '200': { description: Provider-neutral status summary, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /admin/api/v1/runtime-wire-codes:
    get:
      tags: [Administration]
      operationId: getRuntimeWireCodes
      security: [{ AdminSession: [] }]
      responses:
        '200':
          description: Versioned catalog of stable backend wire codes handled by the Admin UI.
          content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeWireCodeCatalog' } } }
        default: { $ref: '#/components/responses/Problem' }
  /admin/api/v1/tenants:
    get:
      tags: [Administration]
      operationId: listTenants
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/DirectoryFilter' }]
      responses: { '200': { description: Tenant page, content: { application/json: { schema: { $ref: '#/components/schemas/TenantPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
    post:
      tags: [Administration]
      operationId: createTenant
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTenant' } } } }
      responses: { '201': { description: Tenant created, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/tenants/{tenantId}:
    get:
      tags: [Administration]
      operationId: getTenant
      security: [{ AdminSession: [] }]
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Tenant with ETag, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }, default: { $ref: '#/components/responses/Problem' } }
    put:
      tags: [Administration]
      operationId: updateTenant
      security: [{ AdminSession: [] }]
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTenant' } } } }
      responses: { '200': { description: Tenant and audit updated atomically, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/tenants/{tenantId}:disable:
    post:
      tags: [Administration]
      operationId: disableTenant
      security: [{ AdminSession: [] }]
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Tenant disabled and audited atomically, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/applications:
    get:
      tags: [Administration]
      operationId: listApplications
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/DirectoryFilter' }]
      responses: { '200': { description: Application page, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
    post:
      tags: [Administration]
      operationId: createApplication
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateApplication' } } } }
      responses: { '201': { description: Application created }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/applications/{applicationId}:
    get:
      tags: [Administration]
      operationId: getApplication
      security: [{ AdminSession: [] }]
      parameters: [{ name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Application with ETag, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }, default: { $ref: '#/components/responses/Problem' } }
    put:
      tags: [Administration]
      operationId: updateApplication
      security: [{ AdminSession: [] }]
      parameters: [{ name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateApplication' } } } }
      responses: { '200': { description: Application and audit updated atomically, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/applications/{applicationId}:disable:
    post:
      tags: [Administration]
      operationId: disableApplication
      security: [{ AdminSession: [] }]
      parameters: [{ name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Application disabled and audited atomically, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }, '409': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/environments:
    get:
      tags: [Administration]
      operationId: listEnvironments
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/DirectoryFilter' }]
      responses: { '200': { description: Environment page, content: { application/json: { schema: { $ref: '#/components/schemas/EnvironmentPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/installations:
    get:
      tags: [Administration]
      operationId: listInstallations
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { name: filter, in: query, description: Literal case-insensitive Installation UUID substring, schema: { type: string, maxLength: 100 } }, { name: applicationId, in: query, schema: { type: string, format: uuid } }, { name: environmentId, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Installation page, content: { application/json: { schema: { $ref: '#/components/schemas/InstallationPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
    post:
      tags: [Administration]
      operationId: createInstallation
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInstallation' } } } }
      responses: { '201': { description: One-time activation response, content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionedActivation' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/installations/{installationId}:
    get:
      tags: [Administration]
      operationId: getInstallation
      security: [{ AdminSession: [] }]
      parameters: [{ name: installationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/TenantId' }]
      responses: { '200': { description: Tenant-scoped installation metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Installation' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/installations/{installationId}:revoke:
    post:
      tags: [Administration]
      operationId: revokeInstallation
      security: [{ AdminSession: [] }]
      parameters: [{ name: installationId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses: { '200': { description: Installation and credentials revoked atomically. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/grants:
    get:
      tags: [Administration]
      operationId: listGrants
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Grant page, content: { application/json: { schema: { $ref: '#/components/schemas/GrantPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
    post:
      tags: [Administration]
      operationId: createGrant
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGrant' } } } }
      responses: { '200': { description: Existing grant returned idempotently, content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } } }, '201': { description: Grant and audit committed atomically, content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/audit:
    get:
      tags: [Administration]
      operationId: listAudit
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Redacted audit page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/audit:export:
    get:
      tags: [Administration]
      operationId: exportAudit
      description: Exports redacted audit events for one tenant in descending occurredAt/id order inside the fixed UTC interval [fromUtc,toUtc). Continuation is a keyset cursor bound to the same interval, not a snapshot. Events with occurredAt >= toUtc are excluded. Late inserts below the cursor can appear on subsequent pages; inserts above it require a new overlapping export, deduplicated by event ID.
      security: [{ AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: fromUtc, in: query, required: true, schema: { type: string, format: date-time }, description: Inclusive UTC lower bound. }
        - { name: toUtc, in: query, required: true, schema: { type: string, format: date-time }, description: Exclusive UTC upper watermark. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256 }, description: Opaque continuation returned by the previous response for the same interval. }
      responses:
        '200':
          description: Redacted audit export page. The response is partial when continuation is non-null.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditExportPage' } } }
        default: { $ref: '#/components/responses/Problem' }
  /admin/api/v1/connectors:
    get:
      tags: [ConnectorsAdmin]
      operationId: listAdminConnectors
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Filter' }]
      responses: { '200': { description: Connector summary page, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/schema:
    get:
      tags: [ConnectorsAdmin]
      operationId: getConnectorDefinitionSchema
      security: [{ AdminSession: [] }]
