      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { $ref: '#/components/requestBodies/ConnectorImport' }
      responses: { '200': { description: Preliminary validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorValidationResult' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors:import:
    post:
      tags: [ConnectorsAdmin]
      operationId: importConnectorDefinition
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { $ref: '#/components/requestBodies/ConnectorImport' }
      responses: { '201': { description: Draft persisted, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorVersion' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/bootstrap:
    post:
      tags: [Administration]
      operationId: bootstrapAdmin
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { name: X-Bootstrap-Token, in: header, required: true, schema: { type: string, writeOnly: true } }]
      responses: { '200': { description: One-time bootstrap and audit committed atomically. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/role-assignments:
    get:
      tags: [Administration]
      operationId: listAdminRoleAssignments
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { name: principalId, in: query, schema: { type: string, format: uuid } }, { name: tenantId, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Role assignment page, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignmentPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
    post:
      tags: [Administration]
      operationId: assignAdminRole
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignmentRequest' } } } }
      responses: { '200': { description: Provider-neutral role assignment created or returned idempotently. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/role-assignments/{assignmentId}:
    delete:
      tags: [Administration]
      operationId: revokeAdminRoleAssignment
      security: [{ AdminSession: [] }]
      parameters: [{ name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '204': { description: Assignment revoked and sessions invalidated. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions:
    get:
      tags: [ConnectorsAdmin]
      operationId: listAdminConnectorVersions
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Filter' }]
      responses: { '200': { description: Redacted version timeline, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorVersionPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}:
    get:
      tags: [ConnectorsAdmin]
      operationId: getAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }]
      responses: { '200': { description: Version metadata with ETag, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorVersion' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}/definition:
    get:
      tags: [ConnectorsAdmin]
      operationId: getAdminConnectorDefinition
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }]
      responses: { '200': { description: Canonical Connector definition without Environment bindings, content: { application/json: { schema: { type: object } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}:validate:
    post:
      tags: [ConnectorsAdmin]
      operationId: validateStoredAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Draft transitioned with ETag, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorVersion' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}:publish:
    post:
      tags: [ConnectorsAdmin]
      operationId: publishAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionActionRequest' } } } }
      responses: { '200': { description: Exact approved connector and binding digest published atomically. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}:retire:
    post:
      tags: [ConnectorsAdmin]
      operationId: retireAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Version retired atomically with audit. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}:rollback:
    post:
      tags: [ConnectorsAdmin]
      operationId: rollbackAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RollbackRequest' } } } }
      responses: { '200': { description: Published version rolled back atomically with audit. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/bindings:
    put:
      tags: [ConnectorsAdmin]
      operationId: putAdminConnectorBindings
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/IfMatchOptional' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorBindingRequest' } } } }
      responses: { '200': { description: Immutable binding revision created; update requires If-Match. }, '428': { $ref: '#/components/responses/Problem' }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}/bindings:
    get:
      tags: [ConnectorsAdmin]
      operationId: listAdminConnectorBindings
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { name: environmentId, in: query, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Immutable binding revision page, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorBindingPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/provider-resources:
    get:
      tags: [ConnectorsAdmin]
      operationId: listProviderResources
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { name: environmentId, in: query, schema: { type: string, format: uuid } }, { name: resourceType, in: query, schema: { $ref: '#/components/schemas/ProviderResourceType' } }]
      responses: { '200': { description: Read-only server-owned logical resource catalog; physical references and values are absent., content: { application/json: { schema: { $ref: '#/components/schemas/ProviderResourceCatalogPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/endpoint-resources:
    get:
      tags: [ConnectorsAdmin]
      operationId: listEndpointResources
      description: Lists deployment-owned HTTPS destinations selectable by the Security Administrator. The browser-supplied identifier, revision and checksum are assertions; the server resolves the effective URI.
      security: [{ AdminSession: [] }]
      parameters: [{ name: environmentId, in: query, required: true, schema: { type: string, format: uuid } }, { name: connectorId, in: query, required: true, schema: { type: string, maxLength: 100 } }]
      responses: { '200': { description: Read-only server-owned endpoint catalog., content: { application/json: { schema: { $ref: '#/components/schemas/EndpointResourceCatalogPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/provider-resources:resolve:
    get:
      tags: [ConnectorsAdmin]
      operationId: resolveExactProviderResource
      description: Resolves one exact current non-secret provider-catalog identity without offset pagination; missing and ambiguous authority fail closed.
      security: [{ AdminSession: [] }]
      parameters:
        - { name: environmentId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: resourceType, in: query, required: true, schema: { $ref: '#/components/schemas/ProviderResourceType' } }
        - { name: providerId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: resourceId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: version, in: query, schema: { type: string, maxLength: 128 } }
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: publicMetadataRevision, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Exact public provider resource., content: { application/json: { schema: { $ref: '#/components/schemas/ProviderResourceCatalog' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/api/v1/connectors/{connectorId}/versions/{version}/approval-requests:
    post:
      tags: [ConnectorsAdmin]
      operationId: requestAdminConnectorApproval
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Checksum-specific approval requested. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}/approval-review:
    get:
      tags: [ConnectorsAdmin]
      operationId: getAdminConnectorApprovalReview
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }]
      responses: { '200': { description: Exact server-built non-secret runtime configuration reviewed for approval, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalReviewResult' } } } }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}/approvals:
    get:
      tags: [ConnectorsAdmin]
      operationId: listAdminConnectorApprovals
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Redacted approval decision page, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalPage' } } } }, default: { $ref: '#/components/responses/Problem' } }
    post:
      tags: [ConnectorsAdmin]
      operationId: approveAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalAcceptanceRequest' } } } }
      responses: { '200': { description: Exact checksum approved by a distinct principal. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}/versions/{version}/rejections:
    post:
      tags: [ConnectorsAdmin]
      operationId: rejectAdminConnectorVersion
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' } } } }
      responses: { '200': { description: Exact checksum rejected by a distinct principal. }, default: { $ref: '#/components/responses/Problem' } }
  /admin/api/v1/connectors/{connectorId}:test:
    post:
      tags: [ConnectorsAdmin]
      operationId: testAdminConnector
      security: [{ AdminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorTestRequest' } } } }
      responses: { '200': { description: Controlled server-side Connector resolution result. }, default: { $ref: '#/components/responses/Problem' } }
  /health/live:
    get:
      tags: [Health]
      responses: { '200': { description: Process alive. } }
  /health/ready:
    get:
      tags: [Health]
      responses:
        '200': { description: Required dependencies ready. }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    InstallationMutualTLS:
      type: mutualTLS
      description: Per-Installation certificate plus ECDSA signed request headers.
    AdminBoundary:
      type: apiKey
      in: header
      name: X-Gateway-Admin-Key
      description: Development-only representation; production deployments must bind OIDC policy.
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-SecureIntegration.Admin
      description: HttpOnly same-origin session created by the server-side OIDC flow.
  parameters:
    BgwTimestamp: { name: X-BG-Timestamp, in: header, required: true, schema: { type: string, format: date-time } }
    BgwNonce: { name: X-BG-Nonce, in: header, required: true, schema: { type: string, minLength: 20, maxLength: 128 } }
    BgwContentSha256: { name: X-BG-Content-SHA256, in: header, required: true, schema: { type: string } }
    BgwSignature: { name: X-BG-Signature, in: header, required: true, schema: { type: string } }
    ConnectorId: { name: connectorId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{2,99}$' } }
    OperationId: { name: operationId, in: path, required: true, schema: { type: string } }
    Version: { name: version, in: path, required: true, schema: { type: string } }
    TenantId: { name: tenantId, in: query, required: true, schema: { type: string, format: uuid } }
    Offset: { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    DirectoryFilter: { name: filter, in: query, required: false, description: Literal case-insensitive substring of name or code or exact UUID; surrounding whitespace is ignored, schema: { type: string, maxLength: 100 } }
    Filter: { name: filter, in: query, required: false, schema: { type: string, maxLength: 100 } }
    Csrf: { name: X-CSRF-TOKEN, in: header, required: true, schema: { type: string }, description: Opaque token obtained from /admin/auth/csrf. }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
    IfMatchOptional: { name: If-Match, in: header, required: false, schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, description: Omit only for create; mandatory for update. }
  requestBodies:
    ConnectorImport:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConnectorImportRequest' }
    VersionAction:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VersionActionRequest' }
  responses:
    Problem:
      description: Redacted stable error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AdminRole:
      type: string
      enum: [Viewer, ConnectorEditor, ConnectorApprover, Operator, SecurityAdministrator]
    AdminSession:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles: { type: array, items: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/AdminRole' }, tenantId: { type: [string, 'null'], format: uuid } } } }
    Dashboard:
      type: object
      required: [tenants, applications, database, provider, generatedAtUtc]
      properties:
        tenants: { type: integer }
        applications: { type: integer }
        database: { type: string, enum: [healthy, unhealthy] }
        provider: { type: string, enum: [healthy, unhealthy] }
        generatedAtUtc: { type: string, format: date-time }
    RuntimeWireCodeCatalog:
      type: object
      additionalProperties: false
      required: [status, health, approval, role, scope, auditAction, auditOutcome, reason]
      properties:
        status: { type: array, items: { type: string } }
        health: { type: array, items: { type: string } }
        approval: { type: array, items: { type: string } }
        role: { type: array, items: { type: string } }
        scope: { type: array, items: { type: string } }
        auditAction: { type: array, items: { type: string } }
        auditOutcome: { type: array, items: { type: string } }
        reason: { type: array, items: { type: string } }
    Page:
      type: object
      required: [items, offset, limit, total]
      properties:
        items: { type: array, items: {} }
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Tenant:
      type: object
      required: [id, code, displayName, status, createdAt, rowVersion]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        displayName: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    TenantPage:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Tenant' } } } }]
    CreateTenant:
      type: object
      additionalProperties: false
      required: [code, displayName]
      properties: { code: { type: string, maxLength: 64 }, displayName: { type: string, maxLength: 256 } }
    UpdateTenant:
      type: object
      additionalProperties: false
      required: [displayName]
      properties: { displayName: { type: string, maxLength: 256 } }
    Application:
      type: object
      required: [id, code, displayName, status, minimumBrokerVersion, createdAt, rowVersion]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        displayName: { type: string }
        status: { type: string }
        minimumBrokerVersion: { type: string }
        maximumBrokerVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    ApplicationPage:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Application' } } } }]
    CreateApplication:
      type: object
      additionalProperties: false
      required: [code, displayName, minimumBrokerVersion]
      properties: { code: { type: string }, displayName: { type: string }, minimumBrokerVersion: { type: string }, maximumBrokerVersion: { type: [string, 'null'] } }
    UpdateApplication:
      type: object
      additionalProperties: false
      required: [displayName, minimumBrokerVersion]
      properties: { displayName: { type: string }, minimumBrokerVersion: { type: string }, maximumBrokerVersion: { type: [string, 'null'] } }
    Environment:
      type: object
      required: [id, code, displayName, productionControls]
      properties: { id: { type: string, format: uuid }, code: { type: string }, displayName: { type: string }, productionControls: { type: boolean } }
    EnvironmentPage:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Environment' } } } }]
    InstallationKind:
      type: string
      enum: [Broker, Direct]
    Installation:
      type: object
      required: [id, tenantId, applicationId, environmentId, status, createdAt, installationKind]
      properties: { id: { type: string, format: uuid }, tenantId: { type: string, format: uuid }, applicationId: { type: string, format: uuid }, environmentId: { type: string, format: uuid }, status: { type: string }, brokerVersion: { type: [string, 'null'] }, clientVersion: { type: [string, 'null'] }, installationKind: { $ref: '#/components/schemas/InstallationKind' }, createdAt: { type: string, format: date-time }, updatedAt: { type: [string, 'null'], format: date-time }, lastSeenAt: { type: [string, 'null'], format: date-time }, revokedAt: { type: [string, 'null'], format: date-time }, revocationReason: { type: [string, 'null'] }, credential: { anyOf: [{ $ref: '#/components/schemas/InstallationCredentialPublicMetadata' }, { type: 'null' }] } }
    InstallationCredentialPublicMetadata:
      type: object
      additionalProperties: false
      required: [credentialId, status, certificateSha256, spkiSha256, serialNumber, notBefore, notAfter]
      properties: { credentialId: { type: string, format: uuid }, status: { type: string }, certificateSha256: { type: string, pattern: '^[0-9A-F]{64}$' }, spkiSha256: { type: string, pattern: '^[0-9A-F]{64}$' }, serialNumber: { type: string }, notBefore: { type: string, format: date-time }, notAfter: { type: string, format: date-time } }
    InstallationPage:
      allOf: [{ $ref: '#/components/schemas/Page' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Installation' } } } }]
    CreateInstallation:
      type: object
      additionalProperties: false
      required: [tenantId, applicationId, environmentId]
      properties: { tenantId: { type: string, format: uuid }, applicationId: { type: string, format: uuid }, environmentId: { type: string, format: uuid }, installationKind: { allOf: [{ $ref: '#/components/schemas/InstallationKind' }], default: Broker } }
    EnrollmentChallengeRequest:
      type: object
      additionalProperties: false
      required: [activationCodeId, publicKeySpki]
      properties: { activationCodeId: { type: string, format: uuid }, publicKeySpki: { type: string } }
    EnrollmentChallengeResponse:
      type: object
      additionalProperties: false
      required: [challengeId, challenge, expiresAt]
      properties: { challengeId: { type: string, format: uuid }, challenge: { type: string }, expiresAt: { type: string, format: date-time } }
    ActivationRequest:
      type: object
      additionalProperties: false
